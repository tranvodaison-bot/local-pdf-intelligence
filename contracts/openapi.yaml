openapi: 3.0.3
info:
  title: Local PDF Intelligence API
  version: 0.1.0-draft
  description: Initial contract; Codex must expand/lint and keep synchronized with code.
servers:
  - url: http://127.0.0.1:{port}/api/v1
    variables:
      port:
        default: '8765'
security:
  - bearerAuth: []
paths:
  /health:
    x-implementation-status: implemented
    get:
      operationId: health
      responses:
        '200':
          description: Runtime health
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Non-loopback peer or untrusted Origin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /workspaces:
    x-implementation-status: implemented
    get:
      operationId: listWorkspaces
      description: Returns all active workspaces; pagination is not yet implemented.
      responses:
        '200':
          description: List workspaces
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Workspace' }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Non-loopback peer or untrusted Origin }
        '503': { description: Database unavailable }
    post:
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Non-loopback peer or untrusted Origin }
        '422': { description: Invalid request }
        '503': { description: Database unavailable }
  /documents/import:
    x-implementation-status: implemented
    post:
      operationId: importDocument
      description: File picker granted capability token; no unrestricted client filesystem paths.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id, file_selection_token]
              properties:
                workspace_id: { type: string }
                file_selection_token: { type: string }
      responses:
        '200': { description: Imported or duplicate; one-use capability consumed }
        '400': { description: Source invalid or unavailable }
        '403': { description: Capability invalid, expired or already used }
  /workspaces/{workspace_id}/documents:
    x-implementation-status: implemented
    parameters:
      - { name: workspace_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: listDocuments
      responses:
        '200': { description: Registered document versions without source paths }
        '503': { description: Database unavailable }
  /versions/{version_id}/content:
    x-implementation-status: implemented
    parameters:
      - { name: version_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: readRegisteredDocument
      responses:
        '200':
          description: Original PDF only when current bytes match the registered SHA-256
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '403': { description: Source unreadable }
        '404': { description: Source or version missing }
        '409': { description: Source changed }
        '503': { description: Database unavailable }
  /search:
    x-implementation-status: planned
    post:
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id, document_version_ids, query]
              properties:
                workspace_id: { type: string }
                document_version_ids:
                  type: array
                  items: { type: string }
                query: { type: string }
                limit: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200': { description: Matches with page/block evidence anchors }
  /research/answer:
    x-implementation-status: planned
    post:
      operationId: researchAnswer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id, document_version_ids, mode, question]
              properties:
                workspace_id: { type: string }
                document_version_ids:
                  type: array
                  items: { type: string }
                mode: { type: string, enum: [EVIDENCE_ONLY, REASONING] }
                question: { type: string }
      responses:
        '200': { description: Grounded research answer }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Workspace:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string }
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
    Health:
      type: object
      properties:
        status: { type: string }
        database: { type: string }
        model: { type: string }
